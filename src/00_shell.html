<title>SenseiDoge</title>
<meta name="description" content="Bilingual (English / 简体中文) course for the AWS Certified AI Practitioner AIF-C01 exam, mapped to exam guide v1.1.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+15&text=SenseiDoge&display=swap">
<style>
/* 考汪 wordmark: Fusion Pixel Font by TakWolf, SIL Open Font License 1.1 (src/assets/fusion-pixel-OFL.txt) */
@font-face{font-family:"Fusion Pixel 12";src:url(__BRANDZH__) format("woff2");font-display:block}
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --surface2:#EDEDE8; --ink:#0B0F1E; --ink2:#33384A; --muted:#656A78; --line:#DDDDD6;
  --accent:#F3C302; --accent-ink:#0B0F1E; --accent-soft:#FDF4CC; --accent-text:#7A5C00;
  --d1:#2D62C6; --d2:#6F46C2; --d3:#0A8163; --d4:#B0620C; --d5:#B53448;
  --good:#0A8163; --bad:#B53448; --warn:#B0620C;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 6px 18px rgba(20,32,48,.06);
  --f-display:"Schibsted Grotesk","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070A16; --surface:#0F1426; --surface2:#171D33; --ink:#EDEEF2; --ink2:#C6C9D4; --muted:#8C91A3; --line:#252B42;
    --accent:#F3C302; --accent-ink:#0B0F1E; --accent-soft:#332B07; --accent-text:#F5CD2A;
    --d1:#7FA5F0; --d2:#AF93EA; --d3:#4DC7A1; --d4:#E7A45A; --d5:#EE8092;
    --good:#4DC7A1; --bad:#EE8092; --warn:#E7A45A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070A16; --surface:#0F1426; --surface2:#171D33; --ink:#EDEEF2; --ink2:#C6C9D4; --muted:#8C91A3; --line:#252B42;
  --accent:#F3C302; --accent-ink:#0B0F1E; --accent-soft:#332B07; --accent-text:#F5CD2A;
  --d1:#7FA5F0; --d2:#AF93EA; --d3:#4DC7A1; --d4:#E7A45A; --d5:#EE8092;
  --good:#4DC7A1; --bad:#EE8092; --warn:#E7A45A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
a{color:var(--accent-text)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0;color:var(--ink)}
code,.mono{font-family:var(--f-mono)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{position:relative;max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.mark{width:38px;height:38px;border-radius:9px;display:block;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
.bt{display:flex;flex-direction:column;line-height:1.15}
.bt b,.drawer-h b{font:400 26px/1 "Jersey 15",var(--f-display);letter-spacing:.01em}
/* pixel-font bold: repeat each stroke one font pixel (2px at 24px) to the right, which stays crisp */
.bt b.brand-zh,.drawer-h b.brand-zh{font:400 24px/1 "Fusion Pixel 12",var(--f-display);letter-spacing:2px;text-shadow:2px 0 0 currentColor;padding-right:2px;-webkit-font-smoothing:none}
.bt small{font-size:11.5px;color:var(--muted)}
.tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:2px;width:max-content;white-space:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 11px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
.tab:hover{background:var(--surface2)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ctrls{position:relative;display:flex;gap:6px;flex:none;margin-left:auto}
.ctl{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ctl:hover{border-color:var(--ink)}
.ctl svg{width:17px;height:17px}
/* header and menu buttons: just the icon, no box; a soft highlight on hover */
.top .ctl,.drawer-h .ctl{border-color:transparent;background:none}
.top .ctl:hover,.drawer-h .ctl:hover{border-color:transparent;background:var(--surface2)}
/* ---- our own controls instead of the browser's ---- */
html{-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent);color:var(--accent-ink)}
input,button,select,textarea{font:inherit;color:inherit}
input[type="search"]{-webkit-appearance:none;appearance:none}
input[type="search"]::-webkit-search-cancel-button,input[type="search"]::-webkit-search-decoration,input[type="search"]::-webkit-search-results-button{-webkit-appearance:none;display:none}
input::-ms-clear{display:none}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 40px var(--surface) inset;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
/* checkbox */
input[type="checkbox"]{-webkit-appearance:none;appearance:none;flex:none;width:18px;height:18px;margin:0;border:1.5px solid var(--muted);border-radius:5px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer;transition:background .12s,border-color .12s}
input[type="checkbox"]::before{content:"";width:10px;height:10px;background:var(--accent-ink);clip-path:polygon(14% 44%,0 60%,40% 100%,100% 22%,86% 8%,39% 70%);transform:scale(0);transition:transform .12s}
input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
input[type="checkbox"]:checked::before{transform:scale(1)}
input[type="checkbox"]:hover{border-color:var(--ink)}
input[type="checkbox"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* switch */
.toggle input[type="checkbox"]{width:36px;height:22px;border-radius:999px;border:0;background:var(--line);place-content:center start;padding:0 3px}
.toggle input[type="checkbox"]::before{width:16px;height:16px;border-radius:50%;background:#fff;clip-path:none;transform:none;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input[type="checkbox"]:checked{background:var(--accent)}
.toggle input[type="checkbox"]:checked::before{transform:translateX(14px);background:var(--accent-ink)}
/* search box with our clear button */
.sfield{position:relative;flex:1 1 220px;min-width:0}
.sfield .field{padding-right:36px}
.sclear{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.sclear:hover{background:var(--surface2);color:var(--ink)}
.sfield input:placeholder-shown ~ .sclear,.gs-bar input:placeholder-shown ~ .sclear{display:none}
.gs-bar .sclear{position:static;transform:none;flex:none}
/* dropdown */
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;text-align:left;cursor:pointer;color:var(--ink)}
.dd-btn:hover:not(:disabled){border-color:var(--ink)}
.dd-btn[aria-expanded="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dd-btn:disabled{cursor:default;opacity:1;color:var(--ink2)}
.dd-btn:disabled .chev{display:none}
.dd-btn .chev{flex:none;color:var(--muted);transition:transform .15s}
.dd-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-val.dd-ph{color:var(--muted)}
.dd-field .dd-btn{padding:9px 12px;font-size:14px;border-radius:9px;margin-top:6px}
.dd-list{position:fixed;z-index:95;margin:0;padding:6px;list-style:none;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 6px rgba(8,12,18,.08),0 16px 40px rgba(8,12,18,.2);outline:none;animation:ddIn .12s ease-out}
.dd-list.up{animation-name:ddUp}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes ddUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dd-group{font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.dd-group:first-child{padding-top:4px}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;line-height:1.35;color:var(--ink);cursor:pointer}
.dd-opt.act{background:var(--surface2)}
.dd-opt.on{font-weight:600}
.dd-tick{flex:none;color:var(--accent-text);visibility:hidden}
.dd-opt.on .dd-tick{visibility:visible}
/* tooltip */
.hint{position:fixed;top:0;left:0;z-index:99;max-width:260px;padding:6px 9px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .12s,transform .12s}
.hint.on{opacity:1;transform:none}
/* hidden scrollbars, scrolling still works */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}

/* burger + drawer: the app measures the header and adds .nav-tight (hide subtitle)
   and then .nav-compact (burger) only when the tabs really do not fit */
.burger{display:none}
.drawer,.drawer-back{display:none}
.nav-tight .bt small{display:none}
.nav-mini .bt{display:none}
.nav-compact .top-in{gap:10px}
.nav-compact .tabs{display:none}
.nav-compact .burger{display:inline-flex}
.nav-compact .brand{flex:1;min-width:0}
.nav-compact .drawer-back{display:block;position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.45);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s}
.nav-compact .drawer{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(300px,84vw);background:var(--surface);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(8,12,18,.18);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-100%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s;overflow-y:auto}
.nav-compact.menu-open .drawer{transform:none;visibility:visible}
.nav-compact.menu-open .drawer-back{opacity:1;visibility:visible}
/* before the script measures, very narrow screens start compact to avoid a flash */
@media (max-width:640px){
  html:not(.nav-measured) .tabs{display:none}
  html:not(.nav-measured) .burger{display:inline-flex}
  html:not(.nav-measured) .brand{flex:1;min-width:0}
  html:not(.nav-measured) .bt small{display:none}
}
.drawer-h{display:flex;align-items:center;gap:10px;padding:2px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.drawer-h b{flex:1}
.drawer-nav{display:grid;gap:2px}
.dlink{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:11px 12px;font-size:15px;font-weight:500;color:var(--ink2);text-align:left}
.dlink svg{width:19px;height:19px;flex:none;color:var(--muted)}
.dlink:hover{background:var(--surface2)}
.dlink[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.dlink[aria-current="page"] svg{color:var(--accent-ink)}
.drawer-foot{margin-top:auto;padding:14px 4px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- layout ---------- */
.main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
.foot{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 36px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
.foot span:last-child{max-width:80ch}
.credit{display:inline-flex;align-items:baseline;gap:5px;font:500 12.5px var(--f-mono);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.credit b{font:700 13px var(--f-display);color:var(--ink);letter-spacing:0;background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%);padding:0 .1em}
.drawer-foot .credit{display:flex;margin-top:6px}
.foot-about{font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.foot-about:hover{color:var(--ink);text-decoration-color:var(--accent)}
.about-back{z-index:60}
.dlg.about{width:min(540px,100%);max-height:calc(100vh - 32px);overflow-y:auto}
.about-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.about-h h3{font-size:20px}
.log-dlg{width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column}
.log-list{overflow:auto;overscroll-behavior:contain;margin:6px -22px 0;padding:0 22px}
.log-rel{padding:14px 0 4px;border-top:1px solid var(--line)}
.log-rel:first-child{border-top:0}
.log-rel h4{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px;margin:0 0 6px;color:var(--ink)}
.log-rel time{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.log-now{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px}
.log-rel ul{margin:0;padding-left:1.2em;color:var(--ink2);font-size:14px;line-height:1.55}
.log-rel li{margin:0 0 6px}
.log-rel li b{color:var(--ink)}
.dlg.about p{margin:12px 0;font-size:14px;line-height:1.6}
.dlg.about p b{color:var(--ink)}
.dlg.about .about-ver{font:500 12.5px var(--f-mono);color:var(--muted);margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 11.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 15px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 11px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;font-size:14px}
.field:focus{outline:2px solid var(--accent-text);outline-offset:0}
.sechead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sechead h2{font-size:clamp(22px,3vw,28px);letter-spacing:-.015em}
.sechead p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* ---------- overview ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:end;padding-block:12px 26px}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin-top:10px}
.hero h1 em{font-style:normal;color:var(--ink);background:linear-gradient(transparent 60%,var(--accent) 60%,var(--accent) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em}
.lede{font-size:16.5px;color:var(--ink2);max-width:56ch;margin:14px 0 18px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fact{background:var(--surface);padding:16px 18px}
.fact b{display:block;font:800 30px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.wbar{display:flex;height:44px;border-radius:10px;overflow:hidden;margin:14px 0 6px}
.wbar div{background:var(--c);color:#fff;font:600 12px var(--f-mono);display:flex;align-items:center;padding-left:10px;white-space:nowrap;overflow:hidden;border-right:2px solid var(--surface)}
:root[data-theme="dark"] .wbar div{color:#0D1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wbar div{color:#0D1219}}
.dlist{display:grid;gap:0;margin-top:10px}
.drow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.drow .dn{font:700 13px var(--f-mono);color:var(--c)}
.drow .dn small{display:block;color:var(--muted);font-weight:500}
.drow h3{font-size:17px}
.drow .tl{display:grid;gap:2px;margin-top:8px}
.tchip{border:0;background:none;border-radius:7px;padding:4px 8px 4px 0;font-size:13.5px;display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:baseline;color:var(--ink2);text-align:left;width:100%;line-height:1.4}
.tchip:hover{background:var(--surface2)}
.tchip .code{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--c)}
.tchip::after{content:"";width:14px}
.tchip.done::after{content:"✓";color:var(--c);font-weight:700}
.ph{font-size:20px;letter-spacing:-.01em}
@media (max-width:600px){.wl{display:none}.drow{grid-template-columns:44px 1fr}.drow .pct{grid-column:2;text-align:left}}
.pct{font:600 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.qtypes{display:grid;gap:10px;margin-top:12px}
.qtype{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.qtype .ic{font:600 11px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--accent-text);white-space:nowrap}
.qtype p{margin:0;font-size:14px;color:var(--ink2)}
.qtype b{color:var(--ink)}
ul.plain{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
ul.plain li{margin:5px 0}

/* ---------- course ---------- */
.course{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.rail .field{margin-bottom:12px}
.rd{margin-bottom:14px}
.rd-h{display:flex;gap:8px;align-items:baseline;font-size:13px;font-weight:600;color:var(--ink);padding:4px 6px}
.rd-h .code{font:700 11.5px var(--f-mono);color:var(--c);white-space:nowrap}
.rt{display:grid;grid-template-columns:34px 1fr 16px;gap:6px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:13.5px;color:var(--ink2);line-height:1.35}
.rt:hover{background:var(--surface2)}
.rt .code{font:600 12px var(--f-mono);color:var(--c);padding-top:1px}
.rt.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-weight:600}
.rt .chk{color:var(--c);font-weight:700;visibility:hidden}
.rt.done .chk{visibility:visible}
.rt .hits{font:500 11px var(--f-mono);color:var(--muted)}
.mselect{display:none}
@media (max-width:900px){
  .course{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mselect{display:block}
}
.lesson{min-width:0}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:600 12px var(--f-mono);color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.crumb .sep{color:var(--line)}
.lesson>h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin:8px 0 18px;max-width:28ch}
.objs{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px 12px;margin-bottom:26px}
.objs-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.objs-h b{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.objs-h span{font-size:12px;color:var(--muted)}
.objs ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.objs li{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;color:var(--ink2);line-height:1.45}
.objs li .oc{font:600 12px var(--f-mono);color:var(--c);padding-top:2px}
.lfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.done-btn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}

/* prose */
.prose{max-width:76ch;font-size:15.5px;color:var(--ink2)}
.prose h3{font-size:21px;letter-spacing:-.01em;margin:34px 0 10px;scroll-margin-top:90px}
.prose h3:first-child{margin-top:0}
.prose h4{font-size:16px;margin:20px 0 6px}
.prose p{margin:10px 0}
.prose ul,.prose ol{padding-left:20px;margin:8px 0}
.prose li{margin:5px 0}
.prose b,.prose strong{color:var(--ink);font-weight:600}
.prose code{font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.tw th{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.tw td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
.tw tr:first-child td{border-top:0}
.tw td:first-child{color:var(--ink);font-weight:600}
.box{--c:var(--muted);border:1px solid color-mix(in srgb,var(--c) 34%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface));border-radius:10px;padding:12px 15px;margin:14px 0}
.box::before{display:block;font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.box p{margin:4px 0}
.box ul{margin:4px 0}
.box.def{--c:var(--d1)} .box.def::before{content:"Definition"}
.box.ex{--c:var(--d3)} .box.ex::before{content:"Worked example"}
.box.note{--c:var(--muted)} .box.note::before{content:"Note"}
.box.rem{--c:var(--d2)} .box.rem::before{content:"Remember for the exam"}
.box.trap{--c:var(--d5)} .box.trap::before{content:"Exam trap"}
:lang(zh) .box.def::before{content:"定义"}
:lang(zh) .box.ex::before{content:"实例讲解"}
:lang(zh) .box.note::before{content:"补充说明"}
:lang(zh) .box.rem::before{content:"考试必记"}
:lang(zh) .box.trap::before{content:"考试陷阱"}
.flow{display:flex;flex-wrap:wrap;gap:8px 0;align-items:stretch;margin:14px 0}
.flow span{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13.5px;font-weight:500;color:var(--ink);display:flex;align-items:center}
.flow span:not(:last-child){margin-right:26px}
.flow span:not(:last-child)::after{content:"→";position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:400}
.flow.loop span:last-child{border-style:dashed}
.nest{margin:16px 0;font-size:13.5px}
.nest div{border:1.5px solid var(--c);border-radius:12px;padding:10px 12px 12px;background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.nest div>b{display:block;font:600 12px var(--f-mono);color:var(--c);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.nest div>i{display:block;font-style:normal;color:var(--ink2);margin-bottom:8px}
.ladder{display:grid;gap:6px;margin:14px 0}
.ladder div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px}
.ladder div b{color:var(--ink)}
.ladder .n{font:700 13px var(--f-mono);color:var(--accent-text)}
.ladder .cost{font:600 12px var(--f-mono);color:var(--warn);letter-spacing:.05em}
.formula{font-family:var(--f-mono);font-size:13.5px;background:var(--surface2);border-radius:8px;padding:10px 12px;margin:10px 0;overflow-x:auto;white-space:pre;color:var(--ink)}

/* ---------- flashcards ---------- */
.fcwrap{max-width:760px;margin:0 auto}
.fc{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:300px;width:100%;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:22px 26px;text-align:left}
.fc:hover{border-color:var(--c,var(--accent))}
.fc>span{display:block}
.fc-mid{display:flex!important;flex-direction:column;gap:8px}
.fc-side,.fc-body{display:block}
.fc-top{display:flex!important;gap:12px;justify-content:space-between;font:600 12px var(--f-mono);color:var(--muted)}
.fc-top .d{color:var(--c)}
.fc-body{font:700 clamp(19px,2.6vw,24px)/1.35 var(--f-display);color:var(--ink);letter-spacing:-.01em}
.fc.back .fc-body{font:500 17px/1.6 var(--f-body);color:var(--ink)}
.fc-side{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--c,var(--accent-text))}
.fc-hint{font-size:12.5px;color:var(--muted)}
.fcnav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:14px}
.meter{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}

/* ---------- exam ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.qlist{display:grid;gap:16px;max-width:860px}
.q:focus{outline:none}
.q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* sits in the question column and sticks to the bottom of the screen, so it is always as wide as the cards */
.qbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:15;max-width:860px;margin-top:16px}
.qbar-in{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px rgba(8,12,18,.06),0 14px 36px rgba(8,12,18,.18);padding:10px 10px 10px 16px}
.qbar-info{flex:1;min-width:0}
.qbar-line{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:13px;color:var(--muted)}
.qbar-line b{font:700 14px var(--f-display);color:var(--ink)}
.qbar-prog{height:4px;border-radius:2px;background:var(--surface2);margin-top:7px;overflow:hidden}
.qbar-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .3s}
.qbar-next{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.qbar-top{flex:none}
.qbar-go{flex:none;margin:0}
.qbar-go .field{width:86px;height:36px;padding:0 10px;text-align:center;font-variant-numeric:tabular-nums}
.qbar-go .field[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.qbar-err{color:var(--bad);font-weight:600}
.qbar-err:empty{display:none}
.qbar .sm{display:none}
@media (max-width:480px){.qbar .lg{display:none}.qbar .sm{display:inline}.qbar-in{padding-left:12px;gap:8px}.qbar-top{display:none}.qbar-go .field{width:64px;padding:0 6px}.qbar-next{padding-inline:12px}}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.qh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:600 12px var(--f-mono);color:var(--muted)}
.qh .qn{color:var(--ink)}
.qh .qd{color:var(--c)}
.qh .qt{margin-left:auto;background:var(--surface2);border-radius:6px;padding:2px 8px;color:var(--ink2)}
.qs{font-size:15.5px;color:var(--ink);margin:10px 0 12px;line-height:1.55}
.opts{display:grid;gap:7px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14.5px;color:var(--ink2);line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .L{font:600 12px var(--f-mono);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface));color:var(--ink)}
.opt.right .L{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.mrow{display:grid;grid-template-columns:1fr minmax(0,1.1fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.mrow.right{border-color:var(--good)} .mrow.wrong{border-color:var(--bad)}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.qact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:12px;border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.55;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--ink2)}
.fb.ok{--c:var(--good)} .fb.no{--c:var(--bad)}
.fb b{color:var(--c)}
.fb p{margin:4px 0 0}
.fb ol{margin:4px 0 0;padding-left:20px}
.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:5;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow);max-width:860px}

.exbar .tm{font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}
.exbar .tm.low{color:var(--bad)}
.exbar .sp{flex:1}
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.score .big{font:800 56px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .big.ok{color:var(--good)} .score .big.no{color:var(--bad)}
.dscore{display:grid;gap:6px;margin-top:10px}
.dscore div{display:grid;grid-template-columns:44px 1fr 60px;gap:10px;align-items:center;font:500 12.5px var(--f-mono)}
.dscore .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.dscore .bar i{display:block;height:100%;background:var(--c)}
@media (max-width:560px){.score{grid-template-columns:1fr}}

/* ---------- services / glossary / plan ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters .field{max-width:340px}
.svc td:first-child{min-width:170px}
@media (max-width:600px){
  .svc table{min-width:0}
  .svc thead{display:none}
  .svc tr{display:block;padding:12px 14px;border-top:1px solid var(--line)}
  .svc tr:first-child{border-top:0}
  .svc td{display:block;border:0;padding:3px 0}
  .svc td:first-child{min-width:0}
  .svc td:last-child{color:var(--muted)}
}
.svc .cat{font:600 11px var(--f-mono);color:var(--c);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.gi b{font:700 15px var(--f-display);color:var(--ink)}
.gi small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.gi p{margin:6px 0 0;font-size:14px;color:var(--ink2);line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--muted)}
.days{display:grid;gap:12px;max-width:860px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.day-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.day-h .dn{font:700 12px var(--f-mono);color:var(--accent-text);text-transform:uppercase;letter-spacing:.07em}
.day-h h3{font-size:17px}
.day-h .pct{margin-left:auto}
.day ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.day label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:14px;color:var(--ink2);cursor:pointer;padding:3px 0}
.day input{margin-top:2px}
.day label.on span{text-decoration:line-through;color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--accent-text);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.fb .link{font-size:13.5px}
.badge{display:inline-block;margin-top:5px;font:500 10.5px var(--f-mono);letter-spacing:.03em;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.in{border-color:color-mix(in srgb,var(--good) 45%,var(--line));color:var(--good)}
.badge.part{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent-text)}
[hidden]{display:none!important}
/* ---------- sync my progress ---------- */
.acct{position:relative}
.acct-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:0 0 0 2px var(--surface)}
.acct.is-synced .acct-dot{background:var(--good)}
.acct.is-pending .acct-dot{background:var(--accent)}
.acct.is-error .acct-dot,.acct.is-offline .acct-dot{background:var(--warn)}
.top .acct[aria-expanded="true"]{border-color:transparent;background:var(--surface2)}
.acct-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:30;width:min(380px,calc(100vw - 32px));max-height:calc(100dvh - 90px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 4px rgba(8,12,18,.06),0 16px 40px rgba(8,12,18,.18);padding:16px 18px 18px;animation:acctIn .14s ease-out}
@keyframes acctIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acct-pop-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px -6px 4px 0}
.acct-pop h3{font-family:var(--f-display);font-size:16px;margin:0;color:var(--ink)}
.acct-x{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);flex:none}
.acct-x:hover{background:var(--surface2);color:var(--ink)}
.acct-pop p{font-size:14px}
.acct-pop .row{display:flex;flex-wrap:wrap;gap:8px}
.acct-form label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 6px}
.acct-row{display:flex;flex-wrap:wrap;gap:8px}
.acct-row .field{flex:1 1 220px;min-width:0}
.acct-msg{min-height:1.2em;margin:10px 0 0!important;color:var(--ink)!important}
.acct-priv{font-size:12.5px!important;color:var(--muted)!important;margin:12px 0 0!important}
.acct-who{font-weight:600;color:var(--ink)!important;margin:8px 0 4px!important}
.acct-state{display:flex;align-items:center;gap:8px;margin:0 0 14px!important}
.acct-state i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.acct-state.is-synced i{background:var(--good)}
.acct-state.is-pending i{background:var(--accent)}
.acct-state.is-error i,.acct-state.is-offline i{background:var(--warn)}
.acct-danger{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.acct-danger p{margin:0 0 10px!important}
.acct-del{color:var(--bad)!important;font-size:13px}
.acct-sent{text-align:center;padding:4px 0 0}
.acct-sent-ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);margin-top:6px}
.acct-sent h4{font-family:var(--f-display);font-size:19px;margin:12px 0 6px;color:var(--ink);outline:none}
.acct-sent-lead{margin:0 0 10px!important}
.acct-sent-to{color:var(--ink);word-break:break-all}
.acct-sent-how{color:var(--muted)!important;font-size:13.5px!important;max-width:36em;margin:0 auto!important}
.acct-sent-act{justify-content:center;align-items:center;gap:16px;margin-top:16px}
.acct-sent-act .btn{min-width:10.5em}
.acct-sent .acct-msg{text-align:center}
.sync-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin:14px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13.5px;color:var(--ink2)}
.cta-t{display:inline-flex;align-items:center;gap:8px}
.cta-t svg{flex:none;color:var(--bad)}
.sync-cta + .sync-cta{margin-top:8px}
/* ---------- accessibility helpers ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:100;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;text-decoration:none;transform:translateY(-160%);transition:transform .15s}
.skip:focus{transform:none}
#app:focus{outline:none}

/* ---------- scroll fade on wide tables (shows there is more to the side) ---------- */
.tw{background:
  linear-gradient(to right,var(--surface) 30%,transparent) left center/36px 100% no-repeat local,
  linear-gradient(to left,var(--surface) 30%,transparent) right center/36px 100% no-repeat local,
  linear-gradient(to right,color-mix(in srgb,var(--ink) 16%,transparent),transparent) left center/14px 100% no-repeat scroll,
  linear-gradient(to left,color-mix(in srgb,var(--ink) 16%,transparent),transparent) right center/14px 100% no-repeat scroll,
  var(--surface)}
.tw th{background:color-mix(in srgb,var(--surface2) 85%,transparent)}

/* ---------- flashcard levels ---------- */
.fc-hint{display:flex!important;flex-wrap:wrap;justify-content:space-between;gap:6px 14px}
.lvl-wrap{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--muted)}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:14px;height:5px;border-radius:3px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.lvl i.on{background:var(--c,var(--accent-text));box-shadow:none}

/* ---------- why the other options are wrong ---------- */
.why{margin-top:10px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--c) 40%,var(--line))}
.why-h{display:block;font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)!important;margin-bottom:6px}
.why ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.why li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.why li b{font:600 12px var(--f-mono);color:var(--muted)!important;padding-top:1px}
.why li.mine{color:var(--ink)}
.why li.mine b{color:var(--bad)!important}

/* ---------- progress panel ---------- */
.prog h3{font-size:16px}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0 20px}
.pstats div{background:var(--surface);padding:12px 14px}
.pstats b{display:block;font:800 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.pstats span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.pstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prog-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px}
@media (max-width:900px){.prog-grid{grid-template-columns:minmax(0,1fr)}}
.chart-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;border:2px solid var(--accent-text)}
.legend .lg-f{background:var(--accent-text)}
.legend .lg-h{background:var(--surface)}
.chartbox{position:relative;overflow-x:auto}
.chartbox svg{display:block;overflow:visible}
.cg{stroke:var(--line);stroke-width:1}
.cpass{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.ct{fill:var(--muted);font:500 11px var(--f-mono)}
.cval{fill:var(--ink);font-weight:700}
.cline{fill:none;stroke:var(--accent-text);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cpt-f{fill:var(--accent-text);stroke:var(--surface);stroke-width:2}
.cpt-h{fill:var(--surface);stroke:var(--accent-text);stroke-width:2}
.chit{fill:transparent;cursor:pointer}
.chit:focus{outline:none;stroke:var(--ink);stroke-width:1.5;fill:color-mix(in srgb,var(--accent) 18%,transparent)}
.ctip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);z-index:2}
.tview{margin-top:10px}
.tview-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;font-size:13px;color:var(--accent-text);font-weight:600;cursor:pointer}
.tview-btn .chev{transform:rotate(-90deg);transition:transform .15s}
.tview-btn[aria-expanded="true"] .chev{transform:none}
.tview .tw{margin-top:8px}
.acc{display:grid;grid-template-columns:30px minmax(0,1fr) 88px;grid-template-areas:"d t v" "d b b";gap:3px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc-d{grid-area:d;font:700 12.5px var(--f-mono);color:var(--c)}
.acc-t{grid-area:t;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-v{grid-area:v;text-align:right;font:500 12px var(--f-mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.acc-bar{grid-area:b;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.acc-bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.focus{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;color:var(--ink)}

/* ---------- global search ---------- */
.gs-back{z-index:70;align-items:start;padding-top:calc(env(safe-area-inset-top,0px) + 8vh)}
.gs{width:min(680px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.gs-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.gs-bar svg{width:19px;height:19px;color:var(--muted);flex:none}
.gs-bar input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:6px 0;outline:none;color:var(--ink)}
.gs-esc{font:600 11px var(--f-mono)}
.gs-res{overflow-y:auto;padding:6px 8px 12px}
.gs-hint{padding:12px 8px;margin:0;font-size:14px}
.gs-g h4{font:600 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 8px 4px}

.gs-g ul{list-style:none;margin:0;padding:0}

.gs-item:hover,.gs-item:focus-visible{background:var(--surface2)}
.gs-t{font-size:14px;color:var(--ink);font-weight:500;line-height:1.4}
.gs-s{font-size:12.5px;color:var(--muted);line-height:1.45}
.gs-item mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.gs-more{font-size:12px;color:var(--muted);margin:2px 10px 0}


/* ---------- exam simulation ---------- */
.seg{flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.qflag{font:600 11.5px var(--f-mono);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:6px;padding:1px 7px}
.qflag.uns{color:var(--muted);border-color:var(--line)}
.simq{max-width:860px}
.simq .q{min-height:320px}
.simnav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:14px}
.flagbtn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.simhint{font-size:12.5px;margin:10px 0 0}
.simrev{max-width:860px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:16px}
.tile{position:relative;height:42px;border-radius:8px;border:1.5px dashed var(--line);background:var(--surface);font:600 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tile.ans{border-style:solid;border-color:var(--surface2);background:var(--surface2);color:var(--ink)}
.tile.fl::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.tile.cur{outline:2px solid var(--accent-text);outline-offset:1px}
.tile:hover{border-color:var(--ink)}
.tile-key{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.tile-key span{display:inline-flex;align-items:center;gap:6px}
.tile-key .tile{display:inline-block;width:18px;height:14px;border-radius:4px}
.tile-key .tile.fl::after{top:2px;right:2px;width:5px;height:5px}
.dlg-back{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.55);display:grid;place-items:center;padding:16px}
.dlg{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h3{font-size:20px}
.dlg p{color:var(--ink2);margin:10px 0 14px;line-height:1.55}
.dlg-stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);padding:10px 12px;background:var(--surface2);border-radius:9px}
.dlg-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.dlg-act{justify-content:flex-end;margin-top:18px}
.verdict{display:inline-block;vertical-align:middle;margin-left:8px;font:600 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 8px;border:1px solid currentColor}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
